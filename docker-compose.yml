services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Optional: raise GitHub API rate limit from 10 req/min to ~1800 req/hr.
      # Create a token at https://github.com/settings/tokens (no scopes needed).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Optional: outbound proxy for server-side GitHub requests, e.g.
      # HTTPS_PROXY=http://host.docker.internal:7890 (Clash on the Docker host).
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    restart: unless-stopped
